<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Memory Card Game</title>
    <meta name="description" content="Test your memory with the ultimate brainrot meme matching game!">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="game-header">
        <h1 id="game-title">🧠 MEME MEMORY 🧠</h1>
        <p class="subtitle">Brainrot Edition — Match the memes!</p>
    </header>

    <section id="stats-bar">
        <div class="stat-box">
            <span class="stat-label">MOVES</span>
            <span class="stat-value" id="moves">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">MATCHES</span>
            <span class="stat-value" id="matches">0 / 6</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">STATUS</span>
            <span class="stat-value" id="status">Playing</span>
        </div>
    </section>

    <main>
        <div id="game-board"></div>
    </main>

    <section id="controls">
        <button id="restart-btn" type="button">🔄 New Game</button>
    </section>

    <div id="win-message" class="hidden">
        <h2>🎉 YOU WON! 🎉</h2>
        <p id="win-details"></p>
        <button id="play-again-btn" type="button">Play Again</button>
    </div>

    <footer id="game-footer">
        <p>💀 Every game has different memes! 💀</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
