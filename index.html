<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Memory Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🧠 Meme Memory Card Game 🧠</h1>
    <p class="subtitle">Match the meme pairs to win!</p>

    <div id="game-info">
        <span id="moves" class="stat">Moves: 0</span>
        <span id="matches" class="stat">Matches: 0 / 6</span>
    </div>

    <div id="game-board"></div>

    <button id="restart-btn">🔄 New Game</button>

    <script src="script.js"></script>
</body>
</html>
